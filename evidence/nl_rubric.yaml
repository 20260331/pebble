rubrics:
  - id: 1
    type: p2p
    text: 不配置通道时，任务仍按既有调度规则执行，默认行为、结果和异常语义保持兼容。

  - id: 2
    type: f2p
    text: 线程池和进程池均支持可选的命名工作负载通道；任务可通过 schedule、map 和装饰器声明通道，未声明通道的任务进入默认通道。

  - id: 3
    type: f2p
    text: 非法权重、未知通道和非正并发上限在任务提交前被明确拒绝。

  - id: 4
    type: f2p
    text: 任一时刻每个通道的活跃任务数不超过其并发上限，整池活跃任务数不超过 worker 总数。

  - id: 5
    type: f2p
    text: 多个通道同时有任务时按配置权重公平轮转；持续积压的通道不能阻止其他已就绪通道在有限轮次内启动。

  - id: 6
    type: f2p
    text: 同一通道内保持提交次序，map 的对外结果顺序不因分块和调度变化。

  - id: 7
    type: f2p
    text: 取消、超时、worker 替换和关闭流程不遗失或重复调度任务，待运行任务保持原通道归属。

  - id: 8
    type: f2p
    text: 线程池与进程池对通道上限、公平轮转和任务归属呈现一致的调度策略。
